<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>GYM BRO - Training Systems</title>

  <!-- Offline Web App Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Frameworks & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="bg-[#090A0F] text-[#F0F2F5] min-h-screen pb-24 selection:bg-[#39FF14] selection:text-black font-sans">

  <!-- Header Banner -->
  <header class="sticky top-0 z-40 bg-[#090A0F]/90 backdrop-blur-md border-b border-[#232738] px-4 py-3 shadow-lg shadow-black/50">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <h1 class="font-black text-xl text-[#39FF14] tracking-wider uppercase italic">GYM BRO TRACKER</h1>
      <button onclick="app.openSettingsModal?.()" class="p-2 rounded-xl bg-[#11131C] border border-[#232738] text-[#8A90A6] hover:text-white transition">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Non-Destructive Active Workout Banner -->
  <div id="activeWorkoutBanner" class="hidden bg-gradient-to-r from-[#11131C] via-[#1a1f2e] to-[#11131C] border-b border-[#39FF14]/50 py-3 px-4 flex items-center justify-between cursor-pointer" onclick="app.switchTab('workout')">
    <span class="text-xs font-bold text-white flex items-center gap-2">
      <span class="relative flex h-2.5 w-2.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#39FF14] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#39FF14]"></span>
      </span>
      ⚡ SESSION IN PROGRESS
    </span>
    <span class="text-xs font-bold text-[#39FF14]">RESUME &rarr;</span>
  </div>

  <!-- Navigation -->
  <nav class="max-w-4xl mx-auto px-4 mt-4">
    <div class="grid grid-cols-2 gap-2 p-1.5 bg-[#11131C] border border-[#232738] rounded-2xl">
      <button id="navHomeBtn" onclick="app.switchTab('home')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 bg-[#39FF14] text-black shadow-md">
        <i data-lucide="home" class="w-4 h-4"></i> Home
      </button>
      <button id="navWorkoutBtn" onclick="app.switchTab('workout')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 text-[#8A90A6] hover:text-white hover:bg-[#232738]/50">
        <i data-lucide="dumbbell" class="w-4 h-4"></i> Active Workout
      </button>
    </div>
  </nav>

  <!-- Main Views -->
  <main class="max-w-4xl mx-auto px-4 py-5">
    
    <!-- Home / Setup View -->
    <section id="homeView" class="space-y-4">
      <div class="bg-[#11131C] border border-[#232738] rounded-2xl p-5 shadow-xl">
        <h3 class="font-bold text-lg text-white uppercase italic">Workout Generator</h3>
        <p class="text-xs text-[#8A90A6] my-2">Dynamic routines with built-in mobility and modular filtering.</p>
        
        <div class="space-y-3 my-4">
          <!-- Modifiers -->
          <div>
            <label class="text-xs font-bold text-[#39FF14] uppercase">Split</label>
            <select id="splitSelect" class="w-full mt-1 bg-[#090A0F] border border-[#232738] text-white text-sm rounded-lg p-2.5">
              <option value="Push">Push</option>
              <option value="Pull">Pull</option>
              <option value="Legs">Legs</option>
              <option value="Full Body">Random Full Body</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-bold text-[#39FF14] uppercase">Equipment</label>
              <select id="equipSelect" class="w-full mt-1 bg-[#090A0F] border border-[#232738] text-white text-sm rounded-lg p-2.5">
                <option value="all">Full Gym</option>
                <option value="body weight">Bodyweight Only</option>
                <option value="dumbbell">Dumbbells</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-bold text-[#39FF14] uppercase">Skill Level</label>
              <select id="skillSelect" class="w-full mt-1 bg-[#090A0F] border border-[#232738] text-white text-sm rounded-lg p-2.5">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="expert">Expert</option>
              </select>
            </div>
          </div>
          <div>
             <label class="flex items-center gap-2 text-sm text-white mt-2">
               <input type="checkbox" id="supersetToggle" class="rounded bg-[#090A0F] border-[#232738] text-[#39FF14]">
               Enable Supersets
             </label>
          </div>
        </div>

        <button onclick="app.generateWorkout()" class="w-full py-4 px-4 rounded-xl bg-[#39FF14] text-black font-black uppercase tracking-wide text-sm shadow-lg shadow-[#39FF14]/20 transition active:scale-[0.98]">
          Generate Protocol
        </button>
      </div>
    </section>

    <!-- Active Workout View -->
    <section id="workoutView" class="hidden space-y-4">
      <div id="activeWorkoutContent"></div>
    </section>
  </main>

  <!-- Rest Timer Overlay -->
  <div id="restTimerDisplay" class="hidden fixed bottom-6 right-6 z-50 bg-[#11131C]/95 border-2 border-[#39FF14] px-5 py-3 rounded-2xl shadow-2xl text-[#39FF14] font-mono text-xl font-bold items-center gap-3 animate-pulse">
    <i data-lucide="timer" class="w-6 h-6"></i>
    <span id="restClock">00:00</span>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
